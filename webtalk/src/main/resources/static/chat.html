<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebTalk</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="chat-page">
  <header class="top-bar">
    <span class="brand">WebTalk</span>
    <div>
      <span id="currentUserLabel" class="current-user"></span>
      <button id="logoutButton" class="logout-button" type="button">로그아웃</button>
    </div>
  </header>

  <div class="chat-body" id="chatBody">
    <aside class="sidebar">
      <div class="search-area">
        <div class="search-row">
          <label for="userSearchInput" class="visually-hidden">아이디 또는 닉네임 검색</label>
          <input id="userSearchInput" type="text" placeholder="아이디 또는 닉네임 검색">
          <button id="userSearchButton" type="button">검색</button>
        </div>
        <ul id="searchResults" class="search-results"></ul>
        <div id="searchEmpty" class="search-empty" hidden>해당 사용자를 찾을 수 없습니다.</div>
      </div>
      <ul id="roomList" class="room-list"></ul>
    </aside>

    <section class="chat-main" id="chatMain">
      <div id="chatPlaceholder" class="chat-placeholder">왼쪽에서 대화 상대를 검색하거나 대화방을 선택하세요.</div>

      <div id="chatRoomView" hidden style="display:flex; flex-direction:column; height:100%;">
        <div class="chat-header">
          <div>
            <button id="backButton" class="back-button" type="button" aria-label="목록으로">←</button>
            <span class="peer-name" id="peerNameLabel"></span>
          </div>
          <span id="connectionStatus" class="connection-status status-connecting">연결 중</span>
        </div>

        <div id="messageList" class="message-list" aria-live="polite"></div>

        <div class="composer">
          <label for="messageInput" class="visually-hidden">메시지 입력</label>
          <textarea id="messageInput" rows="1" maxlength="500" placeholder="메시지를 입력하세요"></textarea>
          <button id="sendButton" type="button" disabled>전송</button>
        </div>
        <div class="composer-hint">Enter로 전송, Shift+Enter로 줄바꿈 (최대 500자)</div>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/socket.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
