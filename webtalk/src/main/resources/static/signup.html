<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebTalk 회원가입</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>회원가입</h1>
    <p class="subtitle">아이디, 닉네임, 비밀번호만으로 계정을 만듭니다.</p>

    <div id="errorBanner" class="error-banner" role="alert" hidden></div>

    <form id="signupForm" novalidate>
      <div class="field">
        <label for="loginId">아이디</label>
        <input id="loginId" name="loginId" type="text" autocomplete="username" required minlength="3" maxlength="40">
        <div class="hint">영문, 숫자, -, _ 로 3~40자</div>
      </div>
      <div class="field">
        <label for="nickname">닉네임</label>
        <input id="nickname" name="nickname" type="text" required maxlength="40">
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
        <div class="hint">8자 이상</div>
      </div>
      <div class="field">
        <label for="passwordConfirm">비밀번호 확인</label>
        <input id="passwordConfirm" name="passwordConfirm" type="password" autocomplete="new-password" required minlength="8">
      </div>
      <button type="submit" id="signupButton" class="primary-button">가입하기</button>
    </form>

    <p class="auth-switch">이미 계정이 있으신가요? <a href="/login.html">로그인</a></p>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/signup.js"></script>
</body>
</html>
