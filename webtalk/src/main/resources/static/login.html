<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebTalk 로그인</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1>WebTalk</h1>
    <p class="subtitle">설치 없이 브라우저에서 바로 대화하세요.</p>

    <div id="errorBanner" class="error-banner" role="alert" hidden></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="loginId">아이디</label>
        <input id="loginId" name="loginId" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" id="loginButton" class="primary-button">로그인</button>
    </form>

    <p class="auth-switch">계정이 없으신가요? <a href="/signup.html">회원가입</a></p>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
